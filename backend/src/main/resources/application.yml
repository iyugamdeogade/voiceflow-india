server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: voiceflow-india
  servlet:
    multipart:
      max-file-size: ${MAX_AUDIO_MB:25}MB
      max-request-size: ${MAX_AUDIO_MB:25}MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/voiceflow?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC}
    username: ${DB_USERNAME:voiceflow}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always            # runs schema.sql on startup; every statement is CREATE TABLE IF NOT EXISTS
      encoding: UTF-8
  jackson:
    default-property-inclusion: non_null

voiceflow:
  speech:
    endpoint: ${SPEECH_API_ENDPOINT:https://api.openai.com/v1/audio/transcriptions}
    model: ${SPEECH_MODEL:whisper-1}
    api-key: ${SPEECH_API_KEY:}
    timeout: ${SPEECH_TIMEOUT:60s}
  audio:
    max-mb: ${MAX_AUDIO_MB:25}     # OpenAI-compatible APIs commonly cap uploads at 25 MB
    min-bytes: 1500
  cleanup:
    default-remove-fillers: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

logging:
  level:
    root: INFO
    com.voiceflow: INFO
